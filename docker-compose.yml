# Business Ops Agent Swarm — local development stack (Phase 0)
#
#   docker compose up --build
#
# - No Ollama, no GPU, no model downloads (ADR-001).
# - Local Postgres is pgvector-enabled; production uses Neon PostgreSQL (ADR-002).
# - n8n is an integration layer only — it is NOT part of the core runtime
#   (ADR-003). Add it later as a separate compose profile if needed.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d business_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/business_ops
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
