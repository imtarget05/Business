# Business Ops Agent Swarm — PRODUCTION stack (24/7)
#
#   docker compose -f docker-compose.prod.yml up -d
#
# - No internal Ollama (cloud LLM via LLM_PROVIDER, ADR-001)
# - External managed Postgres (Neon, ADR-002) via DATABASE_URL
# - restart: always + healthchecks + log rotation
# - Secrets come from .env (never committed)
# - Cloud-ready: no local volume mounts, PORT env var support

x-api-env: &api-env
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required (Neon)}
  LLM_PROVIDER: ${LLM_PROVIDER:-cloudflare_ai}
  LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-instruct}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  PERSISTENCE_ENABLED: "true"
  API_KEY: ${API_KEY:?API_KEY required}
  TENANT_API_KEYS: ${TENANT_API_KEYS:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  INPUT_FILTER_ENABLED: ${INPUT_FILTER_ENABLED:-true}
  INPUT_MAX_CHARS: ${INPUT_MAX_CHARS:-8000}
  PII_MASKING_ENABLED: ${PII_MASKING_ENABLED:-true}
  LEARNING_ENABLED: ${LEARNING_ENABLED:-true}
  LEARNING_CRON_HOUR: ${LEARNING_CRON_HOUR:-3}
  GMAIL_SEND_ENABLED: ${GMAIL_SEND_ENABLED:-false}
  GMAIL_ALLOWED_RECIPIENTS: ${GMAIL_ALLOWED_RECIPIENTS:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  PORT: ${PORT:-8000}

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"]
    environment: *api-env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  telegram_bot:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["python", "-m", "agents.monitoring.telegram_bot"]
    environment: *api-env
    restart: always
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: always
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }