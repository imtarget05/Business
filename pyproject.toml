[project]
name = "business-ops-agent-swarm"
version = "0.1.0"
description = "Business Ops Agent Swarm — multi-agent platform for business operations (Phase 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<0.5",
    "psycopg[binary]>=3.1,<4.0",
    "langgraph>=0.2,<1.0",
    # Feature 2: persistent checkpointing. Pinned to the 2.0.x line: it depends on
    # langgraph-checkpoint only (no langgraph pin), so it stays compatible with the
    # `langgraph<1.0` pin above. A wider range (e.g. <3.0) can resolve a future 2.x/3.x
    # release that requires langgraph>=1.0 and breaks that pin.
    "langgraph-checkpoint-postgres>=2.0,<2.1",
    "langchain-core>=0.3,<1.0",
    "python-telegram-bot>=22.0",
    "httpx>=0.27",
    "reportlab>=4.0,<6.0",  # Task 4: offline PDF branding (Ruling: reportlab, not weasyprint)
    # Feature 3: Prometheus /metrics endpoint + boas_* business counters
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "aiosqlite>=0.20",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]
google = [
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "gspread>=6.0",
]

# ---------------------------------------------------------------------------
# Packaging layout (see docs/adr/ADR-007-repository-structure.md):
#   packages/<name>/  -> importable as `packages.<name>`  (shared libraries)
#   agents/<name>/    -> importable as `agents.<name>`    (domain agents)
#   apps/api/         -> importable as `apps.api`         (FastAPI app)
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["packages*", "agents*", "apps*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

markers = [
    "e2e: true end-to-end tests exercising the full offline path (Telegram -> API -> Orchestrator -> LLM -> Knowledge Base/RAG -> Telegram reply) with mock LLM + mock embedding + SQLite.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"agents/monitoring/research/__init__.py" = ["E402"]
"agents/monitoring/telegram_bot.py" = ["E402"]
"packages/observability/metrics.py" = ["E402"]
"tests/unit/test_food_web_verify.py" = ["E402"]
"tests/unit/test_health_check.py" = ["E402"]
"tests/unit/test_progress_report.py" = ["E402"]
"tests/unit/test_rag_cost.py" = ["E402"]
"tests/unit/test_text_format.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["apps/web", "node_modules", "migrations"]
check_untyped_defs = true
