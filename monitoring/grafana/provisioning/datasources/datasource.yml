# Grafana datasource provisioning (Prometheus).
# Mounted at /etc/grafana/provisioning/datasources/datasource.yml.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s